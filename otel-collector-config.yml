receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  # Prometheus exporter — Prometheus scrapes this for app metrics
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Forward traces to Grafana Tempo
  otlphttp/tempo:
    endpoint: http://tempo:3200/otlp
    tls:
      insecure: true

  # Forward logs to Grafana Loki via its OTLP ingest endpoint
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
