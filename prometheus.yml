global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Kafka broker / consumer-group lag metrics via kafka-exporter
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']

  # App metrics (JVM, HTTP, Kafka client) forwarded from Spring Boot apps
  # via OTLP push → otel-collector → Prometheus exporter
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
